<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Negative Space Signature</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #f7f7f7;
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .orb {
      position: relative;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #0a0a0a, #000 70%);
      mask: radial-gradient(circle at 50% 50%, transparent 36%, #000 36%);
      display: grid;
      place-items: center;
    }
    .monogram {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 120px;
      height: 80px;
      background:
        linear-gradient(0deg, transparent 32%, #000 32% 48%, transparent 48%),
        linear-gradient(90deg, transparent 35%, #000 35% 55%, transparent 55%);
      filter: drop-shadow(0 0 0 #000);
    }
    .orbit {
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      border: 1px dashed rgba(255,255,255,0.2);
      animation: rotate 18s linear infinite;
    }
    @keyframes rotate { to { transform: rotate(360deg); } }
    .intro { text-align: center; display: grid; gap: 10px; }
    h1 { margin: 0; letter-spacing: 0.1em; text-transform: uppercase; font-size: 16px; }
    p { margin: 0; color: rgba(247,247,247,0.75); max-width: 420px; line-height: 1.6; }
    nav { display: flex; gap: 14px; justify-content: center; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }
    nav a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 2px; }
    nav a:hover { border-bottom-color: #f7f7f7; }
  </style>
</head>
<body>
  <div class="intro">
    <div class="orb" aria-hidden="true">
      <div class="monogram"></div>
      <div class="orbit"></div>
    </div>
    <h1>Negative Space Signature</h1>
    <p>TF monogram carved out of darkness. A single orbiting line holds the minimal intro and navigation.</p>
    <nav>
      <a href="#">Work</a>
      <a href="#">Writing</a>
      <a href="#">Contact</a>
    </nav>
  </div>
</body>
</html>
