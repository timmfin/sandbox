<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>White Page, Bold Corners</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Suisse Intl', 'Helvetica Neue', Arial, sans-serif;
      background: #fdfdfd;
      color: #0d0d0d;
      position: relative;
      padding: 32px;
      box-sizing: border-box;
    }
    .frame {
      border: 1px solid #111;
      inset: 18px;
      position: absolute;
      pointer-events: none;
    }
    main { position: relative; height: calc(100vh - 64px); }
    h1 { margin: 0; font-size: 18px; letter-spacing: 0.06em; text-transform: uppercase; }
    nav a, footer a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; transition: 140ms; }
    nav a:hover, footer a:hover { background: #0d0d0d; color: #fff; border-bottom-color: #0d0d0d; }
    nav { position: absolute; top: 0; right: 0; display: flex; gap: 12px; font-size: 13px; }
    .bio { position: absolute; bottom: 0; left: 0; max-width: 340px; line-height: 1.5; font-size: 14px; }
    footer { position: absolute; bottom: 0; right: 0; display: flex; gap: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="frame"></div>
  <main>
    <h1>timmfin.net</h1>
    <nav>
      <a href="#">Work</a>
      <a href="#">Writing</a>
      <a href="#">TF Sketches</a>
      <a href="#">Contact</a>
    </nav>
    <p class="bio">Product systems + developer experience. Shipping minimal, opinionated interfaces and keeping things human.</p>
    <footer>
      <a href="#">LinkedIn</a>
      <a href="#">GitHub</a>
      <a href="#">Email</a>
    </footer>
  </main>
</body>
</html>
