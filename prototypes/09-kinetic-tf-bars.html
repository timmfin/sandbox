<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinetic TF Bars</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #fefefe;
      color: #0c0c0c;
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    header {
      position: absolute;
      top: 60px;
      width: 100%;
      display: grid;
      place-items: center;
    }
    .bars {
      position: relative;
      width: 180px;
      height: 140px;
    }
    .bar {
      position: absolute;
      background: #0c0c0c;
      transition: transform 400ms ease;
    }
    .bar.one { width: 100%; height: 14px; top: 40px; left: 0; }
    .bar.two { width: 14px; height: 100%; top: 0; left: 100px; }
    body:hover .bar.one { transform: translateX(-6px); }
    body:hover .bar.two { transform: translateY(6px); }
    main {
      width: min(520px, 90vw);
      display: grid;
      gap: 18px;
      margin-top: 220px;
      text-align: left;
    }
    h1 { margin: 0; font-size: 24px; letter-spacing: 0.08em; text-transform: uppercase; }
    p { margin: 0; line-height: 1.6; color: rgba(12,12,12,0.72); }
    a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(0,0,0,0.2); padding-bottom: 2px; }
    a:hover { border-bottom-color: #0c0c0c; }
  </style>
</head>
<body>
  <header>
    <div class="bars" aria-hidden="true">
      <div class="bar one"></div>
      <div class="bar two"></div>
    </div>
  </header>
  <main>
    <h1>Kinetic TF Bars</h1>
    <p>Minimal perpendicular bars nod to TensorFlow. Slight motion on hover; content stays composed in a narrow column.</p>
    <p><a href="#">Case studies</a> · <a href="#">Writing</a> · <a href="#">Contact</a></p>
  </main>
</body>
</html>
