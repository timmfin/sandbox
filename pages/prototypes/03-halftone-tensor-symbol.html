<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halftone Tensor Symbol</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #010101;
      color: #f2f2f2;
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    }
    .hero {
      text-align: center;
      display: grid;
      gap: 18px;
    }
    .logo {
      width: 180px;
      height: 180px;
      margin: 0 auto;
      background: radial-gradient(circle at 35% 35%, #fff 0 2px, transparent 3px),
                  radial-gradient(circle at 65% 35%, #fff 0 2px, transparent 3px),
                  radial-gradient(circle at 35% 65%, #fff 0 2px, transparent 3px),
                  radial-gradient(circle at 65% 65%, #fff 0 2px, transparent 3px),
                  radial-gradient(circle at 50% 50%, #fff 0 2px, transparent 3px);
      background-size: 12px 12px;
      background-repeat: repeat;
      mask: linear-gradient(135deg, transparent 20%, #000 20%),
            linear-gradient(-45deg, transparent 35%, #000 35%);
      mask-composite: intersect;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.6));
      transition: filter 220ms ease, transform 220ms ease;
    }
    .logo:hover { filter: drop-shadow(0 16px 32px rgba(255,255,255,0.2)); transform: translateY(-4px); }
    h1 { margin: 0; letter-spacing: 0.14em; font-size: 14px; text-transform: uppercase; }
    p { margin: 0; color: rgba(242,242,242,0.75); max-width: 420px; line-height: 1.6; }
    .cta { display: grid; gap: 10px; }
    .cta a {
      text-decoration: none;
      color: #010101;
      background: #f2f2f2;
      padding: 12px;
      border: 1px solid #f2f2f2;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 12px;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
    }
    .cta a.secondary { background: transparent; color: #f2f2f2; }
    .cta a:hover { background: transparent; color: #f2f2f2; border-color: #f2f2f2; }
  </style>
</head>
<body>
  <section class="hero">
    <div class="logo" aria-hidden="true"></div>
    <h1>Halftone Tensor Symbol</h1>
    <p>TF-inspired monogram built from halftone dots. Minimal vertical story below: a concise intro with primary CTAs.</p>
    <div class="cta">
      <a href="#">See Work</a>
      <a class="secondary" href="#">Contact</a>
    </div>
  </section>
</body>
</html>
