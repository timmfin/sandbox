<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poster Serif Minimal</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f4ef;
      color: #0c0c0c;
      font-family: 'Georgia', 'Iowan Old Style', 'Times New Roman', serif;
      display: grid;
      place-items: center;
      padding: 48px 24px;
    }
    main {
      width: min(820px, 92vw);
      display: grid;
      gap: 24px;
    }
    h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    .rule { border-top: 1px solid #0c0c0c; opacity: 0.4; }
    p { margin: 0; line-height: 1.7; max-width: 640px; }
    footer { display: flex; gap: 20px; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; font-size: 12px; }
    a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; padding-bottom: 2px; }
    a:hover { border-bottom-color: #0c0c0c; }
    .stamp { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; align-self: flex-start; }
  </style>
</head>
<body>
  <main>
    <h1>Tim Fin — Designing Systems.</h1>
    <div class="rule"></div>
    <p>Concise, opinionated, minimal. I build systems and developer experiences that keep teams fast and focused. Less chrome, more clarity.</p>
    <div class="rule"></div>
    <footer>
      <a href="#">Case Studies</a>
      <a href="#">Writing</a>
      <a href="#">TF Icon</a>
      <span class="stamp">TF</span>
    </footer>
  </main>
</body>
</html>
