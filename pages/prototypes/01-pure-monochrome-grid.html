<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pure Monochrome Grid</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050505;
      color: #f5f5f5;
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      letter-spacing: 0.01em;
    }
    main {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
      text-align: center;
    }
    h1 { margin: 0; font-weight: 700; letter-spacing: 0.12em; font-size: clamp(18px, 3vw, 24px); text-transform: uppercase; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 12px;
    }
    a {
      text-decoration: none;
      color: inherit;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 18px 12px;
      display: grid;
      place-items: center;
      text-transform: lowercase;
      font-size: 14px;
      letter-spacing: 0.08em;
      transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
    }
    a span { border-bottom: 1px solid rgba(255,255,255,0.22); padding-bottom: 4px; }
    a:hover { border-color: #fff; background: rgba(255,255,255,0.08); }
  </style>
</head>
<body>
  <main>
    <h1>timmfin.net</h1>
    <div class="grid">
      <a href="#"><span>about</span></a>
      <a href="#"><span>work</span></a>
      <a href="#"><span>writing</span></a>
      <a href="#"><span>speaking</span></a>
      <a href="#"><span>contact</span></a>
      <a href="#"><span>now</span></a>
      <a href="#"><span>notes</span></a>
      <a href="#"><span>tf sketches</span></a>
      <a href="#"><span>resume</span></a>
    </div>
  </main>
</body>
</html>
